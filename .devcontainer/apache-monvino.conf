<VirtualHost *:80>
    DocumentRoot /workspaces/monvino

    <Directory /workspaces/monvino>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Matches the API path expected by the React client in dev mode
    Alias /PW2/cellier-projet/api-php /workspaces/monvino/cellier-projet/api-php

    <Directory /workspaces/monvino/cellier-projet/api-php>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/monvino-error.log
    CustomLog ${APACHE_LOG_DIR}/monvino-access.log combined
</VirtualHost>
